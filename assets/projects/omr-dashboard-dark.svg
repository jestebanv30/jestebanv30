<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="250" viewBox="0 0 480 250" fill="none" role="img"><title>OMR Dashboard</title><desc>Optical mark recognition: reads filled answer sheets with OpenCV and manages students and results in a real-time dashboard.</desc><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
