<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="250" viewBox="0 0 480 250" fill="none" role="img"><title>Space Explorer</title><desc>Immersive 3D web experience to explore space missions, astronauts and spacecraft, backed by a FastAPI + Firebase API.</desc><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-kerning:none}
.m{font-family:JBM,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s{font-family:SG,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.8)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.2,.8,.2,1.2) both}@keyframes blink{50%{opacity:0}}.blink{animation:blink 1s step-end infinite}@keyframes fl{to{transform:translateY(-3px)}}.fl{animation:fl 3.2s ease-in-out infinite alternate}
@keyframes run{to{stroke-dashoffset:-1427.82}}
@keyframes pulse{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.8);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes tw{50%{opacity:.15}}</style><defs><clipPath id="card"><rect width="480" height="250" rx="16"/></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.12"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient><linearGradient id="beam_b" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#0891B2"/><stop offset="0.5" stop-color="#4F46E5"/><stop offset="1" stop-color="#9333EA"/></linearGradient><linearGradient id="planet" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs><rect width="480" height="250" rx="16" fill="#FFFFFF"/><g clip-path="url(#card)"><circle cx="440" cy="40" r="200" fill="url(#glow)"/></g><rect x=".5" y=".5" width="479" height="249" rx="15.5" stroke="#D8DEE4"/><rect x=".75" y=".75" width="478.5" height="248.5" rx="15.25" stroke="url(#beam_b)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="110 1317.82" style="animation:run 7s linear infinite"/><g class="up"><path transform="translate(24 24)" fill="#57606A" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/><text x="48" y="37" class="m" font-size="12.5" fill="#57606A">jestebanv30/space-web-frontend</text><rect x="356.3" y="20" width="99.7" height="24" rx="12" fill="#059669" fill-opacity=".1" stroke="#059669" stroke-opacity=".35"/><circle class="pulse" style="animation-delay:0s" cx="370.3" cy="32" r="3.5" fill="#059669"/><circle cx="370.3" cy="32" r="3.5" fill="#059669"/><text x="380.3" y="36" class="m" font-size="10.5" font-weight="700" letter-spacing="1" fill="#059669">LIVE DEMO</text><text x="24" y="86" class="s" font-size="24" font-weight="700" fill="#1F2328">Space Explorer</text><text x="24" y="118" class="s" font-size="15" fill="#57606A">Immersive 3D web experience to explore</text><text x="24" y="140" class="s" font-size="15" fill="#57606A">space missions, astronauts and spacecraft,</text><text x="24" y="162" class="s" font-size="15" fill="#57606A">backed by a FastAPI + Firebase API.</text><g class="up" style="animation-delay:0.3s"><rect x="24" y="196" width="68.5" height="28" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="37.5" cy="210" r="3.5" fill="#61DAFB"/><text x="47" y="214" class="m" font-size="11.5" fill="#1F2328">React</text></g><g class="up" style="animation-delay:0.38s"><rect x="100.5" y="196" width="89.2" height="28" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="114" cy="210" r="3.5" fill="#1F2328"/><text x="123.5" y="214" class="m" font-size="11.5" fill="#1F2328">Three.js</text></g><g class="up" style="animation-delay:0.46s"><rect x="197.7" y="196" width="61.6" height="28" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="211.2" cy="210" r="3.5" fill="#88CE02"/><text x="220.7" y="214" class="m" font-size="11.5" fill="#1F2328">GSAP</text></g><g class="up" style="animation-delay:0.54s"><rect x="267.3" y="196" width="82.3" height="28" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="280.8" cy="210" r="3.5" fill="#009688"/><text x="290.3" y="214" class="m" font-size="11.5" fill="#1F2328">FastAPI</text></g><g class="up" style="animation-delay:0.62s"><rect x="357.6" y="196" width="89.2" height="28" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="371.1" cy="210" r="3.5" fill="#FFCA28"/><text x="380.6" y="214" class="m" font-size="11.5" fill="#1F2328">Firebase</text></g></g><g class="pop" style="animation-delay:.2s"><circle cx="382" cy="86" r="1.3" fill="#1F2328" style="animation:tw 2.6s ease-in-out infinite"/><circle cx="446" cy="82" r="1" fill="#1F2328" style="animation:tw 3.4s ease-in-out infinite"/><circle cx="452" cy="136" r="1.2" fill="#1F2328" style="animation:tw 2.2s ease-in-out infinite"/><circle cx="390" cy="140" r="0.9" fill="#1F2328" style="animation:tw 3.1s ease-in-out infinite"/><g transform="rotate(-18 416 112)"><path d="M378 112a38 11 0 0 1 76 0" stroke="#4F46E5" stroke-opacity=".55" stroke-width="2"/><circle cx="416" cy="112" r="20" fill="url(#planet)"/><path d="M378 112a38 11 0 0 0 76 0" stroke="#4F46E5" stroke-width="2"/><circle r="4" fill="#1F2328"><animateMotion dur="7s" repeatCount="indefinite" path="M378 112a38 11 0 1 0 76 0a38 11 0 1 0 -76 0"/></circle></g></g></svg>
