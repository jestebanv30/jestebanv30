name: Profile assets

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Static SVGs (header, about, stack, projects, footer)
        run: python scripts/build.py

      # A personal access token saved as the METRICS_TOKEN secret also counts
      # private contributions; without it the built-in token is used.
      - name: Stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh profile assets"
          git push
